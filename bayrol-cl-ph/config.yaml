name: "Bayrol Automatic CL/PH"
description: "Bayrol PoolAccess CL/PH dosing system integration via MQTT Discovery"
version: "0.15.1"
slug: "bayrol_cl_ph"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
url: "https://github.com/uk05de/ha-bayrol-automatic-cl-ph"
startup: services
init: false
homeassistant_api: true
options:
  bayrol_username: ""
  bayrol_password: ""
  device_id: ""
  refresh_interval: 900
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  canister_size_cl: 25
  canister_size_ph: 25
  alert_threshold: 20
  ph_day_limit_ml: 0
  cl_day_limit_ml: 0
  notification_target: ""
  shelly_topic_prefix: ""
  pump_stabilization_seconds: 180
  loglevel: "INFO"
schema:
  bayrol_username: str
  bayrol_password: str
  device_id: str
  refresh_interval: int
  mqtt_host: str
  mqtt_port: int
  mqtt_user: str
  mqtt_password: str
  canister_size_cl: float
  canister_size_ph: float
  alert_threshold: int
  ph_day_limit_ml: float
  cl_day_limit_ml: float
  notification_target: str
  shelly_topic_prefix: str
  pump_stabilization_seconds: int
  loglevel: list(INFO|DEBUG|ERROR)
